<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>아카이브 갤러리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @font-face { font-family:'A2z'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-4Regular.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face { font-family:'A2z'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-7Bold.woff2') format('woff2'); font-weight:700; font-display:swap; }
  @font-face { font-family:'A2z'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-8ExtraBold.woff2') format('woff2'); font-weight:800; font-display:swap; }
  :root{ --paper:#fbf7f2; --ink:#2c2622; --ink-soft:#7d7168; --line:#e8e0d6; --card:#ffffff; --accent:#c2410c; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:'A2z',sans-serif; }
  body{ max-width:1100px; margin:0 auto; padding:28px 18px 80px; }

  .top{ display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .top h1{ font-size:28px; font-weight:800; margin:0; }
  .top a.back{ font-size:13px; color:var(--ink-soft); text-decoration:none; border:1px solid var(--line); background:var(--card); border-radius:16px; padding:7px 14px; }
  .sub{ font-size:13px; color:var(--ink-soft); margin-bottom:20px; }

  .toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .btn-upload{ background:var(--accent); color:#fff; border:none; border-radius:12px; padding:11px 20px; font-family:'A2z',sans-serif; font-weight:700; font-size:14px; cursor:pointer; }
  .sort-tabs{ display:flex; gap:4px; background:#f2ece3; border-radius:12px; padding:3px; }
  .sort-tab{ border:none; background:none; font-family:'A2z',sans-serif; font-size:13px; font-weight:700; color:var(--ink-soft); padding:7px 14px; border-radius:9px; cursor:pointer; }
  .sort-tab.active{ background:#fff; color:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  /* 카드 추천 배지 */
  .card .like-badge{ position:absolute; bottom:6px; right:6px; display:flex; align-items:center; gap:3px; font-size:11px; font-weight:700; color:#fff; background:rgba(0,0,0,.55); border-radius:12px; padding:3px 8px; }
  /* 라이트박스 따봉 */
  .lb-like{ position:absolute; bottom:24px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.15); border:none; border-radius:24px; padding:12px 24px; cursor:pointer; color:#fff; font-family:'A2z',sans-serif; font-weight:700; font-size:16px; backdrop-filter:blur(4px); }
  .lb-like:hover{ background:rgba(255,255,255,.25); }
  .lb-like.liked{ background:rgba(224,64,64,.9); }
  .lb-like .lb-count{ font-size:15px; }

  .gallery{ display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px; }
  .card{ position:relative; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); aspect-ratio:1/1; }
  .card img{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; background:#f0ece6; }
  .card .type-tag{ position:absolute; top:6px; left:6px; font-size:9.5px; font-weight:700; color:#fff; background:rgba(0,0,0,.6); border-radius:5px; padding:2px 6px; text-transform:uppercase; }
  .card .vod-tag{ background:rgba(194,65,12,.9); }
  .card-vod img{ cursor:pointer; }
  .card .play-icon{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:44px; height:44px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; padding-left:3px; pointer-events:none; }
  .card .vod-caption{ position:absolute; left:0; right:0; bottom:0; background:linear-gradient(transparent, rgba(0,0,0,.75)); color:#fff; font-size:10.5px; padding:14px 8px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; }
  .card .del-btn{ position:absolute; top:6px; right:6px; width:26px; height:26px; border:none; border-radius:50%; background:rgba(196,32,32,.9); color:#fff; cursor:pointer; font-size:13px; display:none; align-items:center; justify-content:center; }
  body.is-admin .card .del-btn{ display:flex; }

  .empty{ text-align:center; color:#b5ada3; font-size:14px; padding:60px 0; grid-column:1/-1; }
  .loading{ text-align:center; color:var(--ink-soft); font-size:14px; padding:40px 0; grid-column:1/-1; }

  /* VOD 재생 모달 */
  .vod-modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:110; align-items:center; justify-content:center; padding:20px; }
  .vod-modal.open{ display:flex; }
  .vod-player-wrap{ width:100%; max-width:900px; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; }
  .vod-player-wrap iframe{ width:100%; height:100%; border:0; display:block; }
  .vod-modal .close{ position:absolute; top:16px; right:20px; width:40px; height:40px; border:none; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; font-size:20px; cursor:pointer; z-index:2; }
  /* 라이트박스 (원본 보기, 애니메이션 재생) */
  .lightbox{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:100; align-items:center; justify-content:center; padding:20px; }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; }
  .lightbox .close{ position:absolute; top:16px; right:20px; width:40px; height:40px; border:none; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; font-size:20px; cursor:pointer; }

  /* 업로드 모달 */
  .up-modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:120; align-items:center; justify-content:center; padding:16px; }
  .up-modal.open{ display:flex; }
  .up-box{ background:#fff; border-radius:18px; max-width:420px; width:100%; padding:24px; }
  .up-box h2{ font-size:18px; font-weight:800; margin:0 0 6px; }
  .up-tabs{ display:flex; gap:4px; background:#f2ece3; border-radius:12px; padding:3px; margin-bottom:16px; }
  .up-tab{ flex:1; border:none; background:none; font-family:'A2z',sans-serif; font-size:13px; font-weight:700; color:var(--ink-soft); padding:9px; border-radius:9px; cursor:pointer; }
  .up-tab.active{ background:#fff; color:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .up-box .hint{ font-size:12px; color:var(--ink-soft); margin-bottom:16px; line-height:1.5; }
  .drop{ border:2px dashed var(--line); border-radius:12px; padding:28px 16px; text-align:center; color:var(--ink-soft); font-size:13px; cursor:pointer; margin-bottom:12px; }
  .drop.drag{ border-color:var(--accent); background:#fff8f4; }
  .preview-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .preview-row img{ width:54px; height:54px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .preview-row .fname{ font-size:12px; color:var(--ink); word-break:break-all; }
  .preview-list{ max-height:240px; overflow-y:auto; margin-bottom:12px; display:flex; flex-direction:column; gap:8px; }
  .preview-item{ display:flex; align-items:center; gap:10px; padding:6px; border:1px solid var(--line); border-radius:10px; }
  .preview-item img{ width:44px; height:44px; object-fit:cover; border-radius:7px; border:1px solid var(--line); flex:none; background:#f0ece6; }
  .preview-item .pi-name{ flex:1; min-width:0; font-size:11.5px; color:var(--ink); word-break:break-all; }
  .preview-item .pi-status{ flex:none; font-size:11px; color:var(--ink-soft); }
  .preview-item .pi-status.done{ color:#16a34a; }
  .preview-item .pi-status.fail{ color:#c0392b; }
  .preview-item .pi-remove{ flex:none; border:none; background:none; color:#c0392b; cursor:pointer; font-size:14px; padding:2px 4px; }
  .up-actions{ display:flex; gap:8px; }
  .up-actions button{ flex:1; padding:11px; border:none; border-radius:10px; font-family:'A2z',sans-serif; font-weight:700; font-size:13px; cursor:pointer; }
  .up-do{ background:var(--accent); color:#fff; }
  .up-cancel{ background:#f2ece3; color:var(--ink-soft); }
  .up-progress{ font-size:12px; color:var(--accent); text-align:center; margin-top:8px; min-height:16px; }
</style>
</head>
<body>
  <div class="top">
    <h1>📁 아카이브</h1>
    <a class="back" href="/">← 캘린더</a>
  </div>
  <div class="sub">누구나 이미지를 업로드할 수 있어요. (webp · gif · png)</div>

  <div class="toolbar">
    <button class="btn-upload" id="uploadBtn">＋ 업로드</button>
    <div class="sort-tabs">
      <button class="sort-tab active" data-sort="recent">최신순</button>
      <button class="sort-tab" data-sort="likes">추천순</button>
    </div>
    <span id="loginStatus" style="display:none;font-size:12px;color:#16a34a">● 로그인 상태</span>
  </div>

  <div class="gallery" id="gallery">
    <div class="loading">불러오는 중…</div>
  </div>

  <!-- 라이트박스 -->
  <div class="lightbox" id="lightbox">
    <button class="close" id="lbClose">✕</button>
    <img id="lbImg" src="" alt="" />
    <button class="lb-like" id="lbLike">👍 <span class="lb-count" id="lbCount">0</span></button>
  </div>

  <!-- VOD 재생 모달 -->
  <div class="vod-modal" id="vodPlayModal">
    <button class="close" id="vodPlayClose">✕</button>
    <div class="vod-player-wrap">
      <iframe id="vodPlayer" src="" frameborder="0" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <!-- 업로드 모달 -->
  <div class="up-modal" id="upModal">
    <div class="up-box">
      <h2>추가하기</h2>
      <div class="up-tabs">
        <button class="up-tab active" data-uptab="image">🖼️ 이미지</button>
        <button class="up-tab" data-uptab="vod">▶ VOD·클립</button>
      </div>

      <!-- 이미지 탭 -->
      <div class="up-pane" id="paneImage">
        <div class="hint">webp · gif · png (각 최대 10MB). 여러 개를 한 번에 올릴 수 있어요. 움직이는 이미지는 정지 썸네일이 자동 생성돼요.</div>
        <div class="drop" id="dropZone">
          클릭하거나 파일을 여기로 끌어다 놓으세요<br><small style="color:#b5ada3">여러 개 선택 가능</small>
          <input type="file" id="fileInput" accept="image/webp,image/gif,image/png" multiple style="display:none" />
        </div>
        <div class="preview-list" id="previewList" style="display:none"></div>
        <div class="up-actions">
          <button class="up-cancel" id="upCancel">취소</button>
          <button class="up-do" id="upDo" disabled>업로드</button>
        </div>
        <div class="up-progress" id="upProgress"></div>
      </div>

      <!-- VOD 탭 -->
      <div class="up-pane" id="paneVod" style="display:none">
        <div class="hint">SOOP VOD·클립 URL을 넣으면 썸네일과 제목을 가져와요.<br><small style="color:#b5ada3">예: https://vod.sooplive.com/player/183858893</small></div>
        <div style="display:flex;gap:6px;margin-bottom:12px">
          <input type="text" id="vodInput" placeholder="VOD·클립 URL" style="flex:1;min-width:0;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:13px;font-family:inherit" />
          <button id="vodFetchBtn" style="height:38px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-family:'A2z',sans-serif;font-weight:700;font-size:13px;padding:0 16px;cursor:pointer;flex:none">불러오기</button>
        </div>
        <div id="vodPreview" style="display:none;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px">
          <img id="vodThumb" src="" alt="" style="width:100%;aspect-ratio:16/9;object-fit:cover;background:#f0ece6;display:block" />
          <div style="padding:10px 12px">
            <div id="vodTitle" style="font-weight:700;font-size:14px;color:var(--ink);margin-bottom:3px"></div>
            <div id="vodMeta" style="font-size:11.5px;color:var(--ink-soft)"></div>
          </div>
        </div>
        <div class="up-actions">
          <button class="up-cancel" id="vodCancel">취소</button>
          <button class="up-do" id="vodAdd" disabled>추가</button>
        </div>
        <div class="up-progress" id="vodProgress"></div>
      </div>
    </div>
  </div>
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://fwlkyyvrkunqqtyttilp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3bGt5eXZya3VucXF0eXR0aWxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2MTIyODcsImV4cCI6MjEwMDE4ODI4N30.bFTQVch4TYCxXAWvtTcWdLA4B4HeyAeepqLjZ2daJWI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isAdmin = false;
let currentSort = 'recent'; // 'recent' | 'likes'
let itemsCache = [];        // 추천수 포함 아이템 캐시

const galleryEl = document.getElementById('gallery');
const fileUrl = function(key){ return '/api/r2/file?key=' + encodeURIComponent(key); };

// 방문자 식별
function voterId(){
  let v = localStorage.getItem('archive_voter');
  if(!v){ v = 'av_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('archive_voter', v); }
  return v;
}
// 내가 추천한 이미지 캐시
function myLikes(){
  try{ return JSON.parse(localStorage.getItem('archive_mylikes') || '{}'); }catch(e){ return {}; }
}
function setMyLike(itemId, liked){
  const m = myLikes();
  if(liked) m[itemId] = 1; else delete m[itemId];
  localStorage.setItem('archive_mylikes', JSON.stringify(m));
}

// ── 갤러리 로드 ────────────────────────────────────────────
async function loadGallery(){
  // 이미지 + 추천수 동시 로드
  const [itemsRes, likesRes] = await Promise.all([
    sb.from('archive_items').select('*'),
    sb.from('archive_likes').select('item_id')
  ]);
  const items = itemsRes.data || [];
  const likes = likesRes.data || [];
  // 추천수 집계
  const likeCount = {};
  likes.forEach(function(l){ likeCount[l.item_id] = (likeCount[l.item_id] || 0) + 1; });
  itemsCache = items.map(function(it){ return Object.assign({}, it, { likes: likeCount[it.id] || 0 }); });
  renderGallery();
}

function renderGallery(){
  if(!itemsCache.length){
    galleryEl.innerHTML = '<div class="empty">아직 업로드된 이미지가 없어요.</div>';
    return;
  }
  // 정렬
  const sorted = itemsCache.slice().sort(function(a,b){
    if(currentSort === 'likes'){
      if(b.likes !== a.likes) return b.likes - a.likes;
      return b.created_at.localeCompare(a.created_at); // 동률이면 최신순
    }
    return b.created_at.localeCompare(a.created_at);    // 최신순
  });
  galleryEl.innerHTML = sorted.map(function(it){
    const isVod = it.kind === 'vod';
    if(isVod){
      // VOD 카드: 외부 썸네일 + 재생 아이콘, 클릭 시 모달에서 재생
      const thumb = it.thumb_url || '';
      // title_no 추출해서 embed URL 구성
      const tnMatch = (it.vod_url || '').match(/(\d{6,})/);
      const embedUrl = tnMatch ? 'https://vod.sooplive.com/player/' + tnMatch[1] + '/embed?autoPlay=true&showChat=false&mutePlay=false' : '';
      return '<div class="card card-vod" data-id="' + it.id + '" data-vodurl="' + (it.vod_url||'') + '">' +
        '<img src="' + thumb + '" loading="lazy" alt="" data-vodplay="' + embedUrl + '" data-voditem="' + it.id + '" onerror="this.style.background=\'#ddd\'" />' +
        '<span class="type-tag vod-tag">▶ VOD</span>' +
        '<span class="play-icon">▶</span>' +
        (it.vod_title ? '<span class="vod-caption">' + it.vod_title + '</span>' : '') +
        (it.likes > 0 ? '<span class="like-badge">👍 ' + it.likes + '</span>' : '') +
        '<button class="del-btn" data-del="' + it.id + '">✕</button>' +
      '</div>';
    }
    const thumb = it.thumb_key ? fileUrl(it.thumb_key) : fileUrl(it.file_key);
    const orig = fileUrl(it.file_key);
    const ext = (it.file_type || '').split('/')[1] || '';
    return '<div class="card" data-id="' + it.id + '" data-orig="' + orig + '" data-filekey="' + it.file_key + '" data-thumbkey="' + (it.thumb_key||'') + '">' +
      '<img src="' + thumb + '" loading="lazy" alt="" data-open="' + orig + '" data-openid="' + it.id + '" />' +
      (ext ? '<span class="type-tag">' + ext + '</span>' : '') +
      (it.likes > 0 ? '<span class="like-badge">👍 ' + it.likes + '</span>' : '') +
      '<button class="del-btn" data-del="' + it.id + '">✕</button>' +
    '</div>';
  }).join('');
}

// 정렬 토글
document.querySelector('.sort-tabs').addEventListener('click', function(e){
  const tab = e.target.closest('[data-sort]');
  if(!tab) return;
  currentSort = tab.dataset.sort;
  document.querySelectorAll('.sort-tab').forEach(function(t){ t.classList.toggle('active', t === tab); });
  renderGallery();
});

// ── 라이트박스 (원본/애니메이션 보기 + 추천) ───────────────
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbLike = document.getElementById('lbLike');
const lbCount = document.getElementById('lbCount');
let lbItemId = null;

galleryEl.addEventListener('click', function(e){
  const img = e.target.closest('[data-open]');
  const vod = e.target.closest('[data-vodplay]');
  const del = e.target.closest('[data-del]');
  if(del){ e.stopPropagation(); handleDelete(del.dataset.del); return; }
  if(vod){ openVodPlayer(vod.dataset.vodplay); return; }
  if(img){ openLightbox(img.dataset.open, img.dataset.openid); }
});

// VOD 재생 모달
const vodPlayModal = document.getElementById('vodPlayModal');
const vodPlayer = document.getElementById('vodPlayer');
function openVodPlayer(embedUrl){
  if(!embedUrl) return;
  vodPlayer.src = embedUrl;
  vodPlayModal.classList.add('open');
}
function closeVodPlayer(){
  vodPlayModal.classList.remove('open');
  vodPlayer.src = 'about:blank'; // 재생 확실히 중지
}
document.getElementById('vodPlayClose').addEventListener('click', closeVodPlayer);
vodPlayModal.addEventListener('click', function(e){ if(e.target === vodPlayModal) closeVodPlayer(); });

function openLightbox(src, itemId){
  lbImg.src = src;
  lbItemId = itemId;
  const item = itemsCache.find(function(x){ return x.id === itemId; });
  const liked = !!myLikes()[itemId];
  lbCount.textContent = item ? item.likes : 0;
  lbLike.classList.toggle('liked', liked);
  lightbox.classList.add('open');
}
function closeLightbox(){ lightbox.classList.remove('open'); lbImg.src=''; lbItemId = null; }

document.getElementById('lbClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', function(e){ if(e.target === lightbox) closeLightbox(); });

// 따봉 토글
lbLike.addEventListener('click', async function(){
  if(!lbItemId) return;
  const liked = !!myLikes()[lbItemId];
  const item = itemsCache.find(function(x){ return x.id === lbItemId; });
  lbLike.disabled = true;
  try{
    if(liked){
      // 취소
      await sb.from('archive_likes').delete().eq('item_id', lbItemId).eq('voter_id', voterId());
      setMyLike(lbItemId, false);
      if(item) item.likes = Math.max(0, item.likes - 1);
    } else {
      // 추천
      const res = await sb.from('archive_likes').insert({ item_id: lbItemId, voter_id: voterId() });
      if(res.error && res.error.code !== '23505'){ throw new Error(res.error.message); } // 중복은 무시
      setMyLike(lbItemId, true);
      if(item) item.likes = item.likes + 1;
    }
    lbCount.textContent = item ? item.likes : 0;
    lbLike.classList.toggle('liked', !liked);
    renderGallery(); // 배지/정렬 갱신
  }catch(e){
    alert('추천 처리 실패: ' + e.message);
  }
  lbLike.disabled = false;
});

// ── 삭제 (어드민) ──────────────────────────────────────────
async function handleDelete(id){
  if(!isAdmin) return;
  if(!confirm('삭제할까요?')) return;
  const card = galleryEl.querySelector('[data-id="' + id + '"]');
  const fileKey = card ? card.dataset.filekey : null;
  const thumbKey = card ? card.dataset.thumbkey : null;
  // R2 파일이 있는 경우만 삭제 (VOD는 file_key가 'vod:'라 R2 파일 없음)
  const hasR2 = fileKey && fileKey.indexOf('archive/') === 0;
  if(hasR2){
    const { data:{ session } } = await sb.auth.getSession();
    const token = session ? session.access_token : '';
    try{
      await fetch('/api/r2/delete', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
        body: JSON.stringify({ fileKey: fileKey, thumbKey: thumbKey || null })
      });
    }catch(e){}
  }
  // DB 행 삭제
  const res = await sb.from('archive_items').delete().eq('id', id);
  if(res.error){ alert('삭제 실패: ' + res.error.message); return; }
  await loadGallery();
}

// ── 업로드 (여러 개) ───────────────────────────────────────
const upModal = document.getElementById('upModal');
const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const previewList = document.getElementById('previewList');
let uploadQueue = []; // { file, thumbBlob, id, status }

document.getElementById('uploadBtn').addEventListener('click', function(){ resetUpload(); resetVod(); switchUpTab('image'); upModal.classList.add('open'); });

// ── 업로드 탭 전환 ─────────────────────────────────────────
function switchUpTab(tab){
  document.querySelectorAll('.up-tab').forEach(function(t){ t.classList.toggle('active', t.dataset.uptab === tab); });
  document.getElementById('paneImage').style.display = tab === 'image' ? '' : 'none';
  document.getElementById('paneVod').style.display = tab === 'vod' ? '' : 'none';
}
document.querySelector('.up-tabs').addEventListener('click', function(e){
  const t = e.target.closest('[data-uptab]');
  if(t) switchUpTab(t.dataset.uptab);
});

// ── VOD 추가 ───────────────────────────────────────────────
let vodData = null;
const vodInput = document.getElementById('vodInput');

function resetVod(){
  vodData = null;
  vodInput.value = '';
  document.getElementById('vodPreview').style.display = 'none';
  document.getElementById('vodAdd').disabled = true;
  document.getElementById('vodProgress').textContent = '';
}
document.getElementById('vodCancel').addEventListener('click', function(){ upModal.classList.remove('open'); });

document.getElementById('vodFetchBtn').addEventListener('click', fetchVod);
vodInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') fetchVod(); });

async function fetchVod(){
  const url = vodInput.value.trim();
  if(!url){ return; }
  const prog = document.getElementById('vodProgress');
  prog.textContent = '불러오는 중…';
  document.getElementById('vodAdd').disabled = true;
  try{
    const res = await fetch('/api/soop-vod?url=' + encodeURIComponent(url));
    const d = await res.json();
    if(!d.ok){ throw new Error('VOD 정보를 가져올 수 없어요. URL을 확인해주세요.'); }
    vodData = d;
    // 미리보기
    document.getElementById('vodThumb').src = d.thumb || '';
    document.getElementById('vodTitle').textContent = d.title || '(제목 없음)';
    let meta = d.bjNick ? d.bjNick : (d.bjId || '');
    if(d.duration){ const sec = Math.floor(d.duration/1000); meta += '  ·  ' + Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); }
    if(d.viewCount) meta += '  ·  조회 ' + Number(d.viewCount).toLocaleString();
    document.getElementById('vodMeta').textContent = meta;
    document.getElementById('vodPreview').style.display = 'block';
    document.getElementById('vodAdd').disabled = false;
    prog.textContent = '';
  }catch(e){
    prog.textContent = e.message;
    vodData = null;
  }
}

document.getElementById('vodAdd').addEventListener('click', async function(){
  if(!vodData) return;
  const prog = document.getElementById('vodProgress');
  prog.textContent = '추가 중…';
  document.getElementById('vodAdd').disabled = true;
  try{
    const ins = await sb.from('archive_items').insert({
      kind: 'vod',
      vod_url: vodData.vodUrl,
      vod_title: vodData.title,
      thumb_url: vodData.thumb,
      file_key: 'vod:' + vodData.titleNo,  // NOT NULL 제약 대응 (VOD는 실제 R2 파일 없음)
      file_type: 'video/vod'
    });
    if(ins.error){ throw new Error(ins.error.message); }
    prog.textContent = '완료!';
    await loadGallery();
    setTimeout(function(){ upModal.classList.remove('open'); }, 600);
  }catch(e){
    prog.textContent = '실패: ' + e.message;
    document.getElementById('vodAdd').disabled = false;
  }
});
document.getElementById('upCancel').addEventListener('click', function(){ upModal.classList.remove('open'); });
upModal.addEventListener('click', function(e){ if(e.target === upModal) upModal.classList.remove('open'); });
dropZone.addEventListener('click', function(){ fileInput.click(); });
fileInput.addEventListener('change', function(){ addFiles(fileInput.files); });
dropZone.addEventListener('dragover', function(e){ e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', function(){ dropZone.classList.remove('drag'); });
dropZone.addEventListener('drop', function(e){ e.preventDefault(); dropZone.classList.remove('drag'); addFiles(e.dataTransfer.files); });

function resetUpload(){
  uploadQueue = [];
  previewList.style.display = 'none';
  previewList.innerHTML = '';
  document.getElementById('upDo').disabled = true;
  document.getElementById('upProgress').textContent = '';
  fileInput.value = '';
}

const ALLOWED = ['image/webp','image/gif','image/png'];
async function addFiles(fileList){
  const files = Array.prototype.slice.call(fileList || []);
  for(const file of files){
    if(!ALLOWED.includes(file.type)){ continue; }          // 허용 안 되는 형식은 조용히 건너뜀
    if(file.size > 10*1024*1024){ alert(file.name + ' : 10MB를 넘어 제외됐어요.'); continue; }
    const id = 'q_' + Math.random().toString(36).slice(2);
    const item = { file: file, thumbBlob: null, id: id, status: 'pending' };
    uploadQueue.push(item);
    // 썸네일 비동기 생성
    makeThumb(file).then(function(blob){ item.thumbBlob = blob; }).catch(function(){ item.thumbBlob = null; });
  }
  fileInput.value = '';
  renderPreviewList();
}

function renderPreviewList(){
  if(!uploadQueue.length){
    previewList.style.display = 'none';
    document.getElementById('upDo').disabled = true;
    return;
  }
  previewList.style.display = 'flex';
  previewList.innerHTML = uploadQueue.map(function(item){
    const url = URL.createObjectURL(item.file);
    let statusText = '', statusCls = '';
    if(item.status === 'done'){ statusText = '완료'; statusCls = 'done'; }
    else if(item.status === 'fail'){ statusText = '실패'; statusCls = 'fail'; }
    else if(item.status === 'uploading'){ statusText = '올리는 중…'; }
    return '<div class="preview-item" data-qid="' + item.id + '">' +
      '<img src="' + url + '" alt="" />' +
      '<span class="pi-name">' + item.file.name + '</span>' +
      (statusText ? '<span class="pi-status ' + statusCls + '">' + statusText + '</span>' : '') +
      (item.status === 'pending' ? '<button class="pi-remove" data-remove="' + item.id + '">✕</button>' : '') +
    '</div>';
  }).join('');
  document.getElementById('upDo').disabled = false;
  document.getElementById('upDo').textContent = '업로드 (' + uploadQueue.length + ')';
}

previewList.addEventListener('click', function(e){
  const rm = e.target.closest('[data-remove]');
  if(rm){
    uploadQueue = uploadQueue.filter(function(x){ return x.id !== rm.dataset.remove; });
    renderPreviewList();
  }
});

// 이미지 첫 프레임을 canvas로 그려 정지 png 썸네일 생성
function makeThumb(file){
  return new Promise(function(resolve, reject){
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function(){
      const MAX = 400;
      let w = img.naturalWidth, h = img.naturalHeight;
      if(w > h && w > MAX){ h = Math.round(h * MAX / w); w = MAX; }
      else if(h >= w && h > MAX){ w = Math.round(w * MAX / h); h = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(function(blob){ blob ? resolve(blob) : reject(new Error('thumb fail')); }, 'image/png', 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('img load fail')); };
    img.src = url;
  });
}

document.getElementById('upDo').addEventListener('click', async function(){
  const pending = uploadQueue.filter(function(x){ return x.status === 'pending'; });
  if(!pending.length) return;
  const prog = document.getElementById('upProgress');
  document.getElementById('upDo').disabled = true;
  let ok = 0, fail = 0;

  for(let i = 0; i < pending.length; i++){
    const item = pending[i];
    item.status = 'uploading';
    renderPreviewList();
    prog.textContent = '업로드 중… (' + (i+1) + '/' + pending.length + ')';
    try{
      // 썸네일이 아직 생성 중이면 잠깐 대기
      if(item.thumbBlob === null){
        item.thumbBlob = await makeThumb(item.file).catch(function(){ return null; });
      }
      const fd = new FormData();
      fd.append('file', item.file);
      if(item.thumbBlob) fd.append('thumb', item.thumbBlob, 'thumb.png');
      const res = await fetch('/api/r2/upload', { method:'POST', body: fd });
      const data = await res.json();
      if(!res.ok || data.error){ throw new Error(data.error || '업로드 실패'); }
      const ins = await sb.from('archive_items').insert({
        file_key: data.fileKey,
        thumb_key: data.thumbKey || null,
        file_type: data.fileType
      });
      if(ins.error){ throw new Error(ins.error.message); }
      item.status = 'done'; ok++;
    }catch(e){
      item.status = 'fail'; fail++;
    }
    renderPreviewList();
  }

  prog.textContent = '완료! 성공 ' + ok + '개' + (fail ? ' · 실패 ' + fail + '개' : '');
  await loadGallery();
  // 전부 성공이면 잠시 후 닫기
  if(!fail){
    setTimeout(function(){ upModal.classList.remove('open'); }, 800);
  } else {
    document.getElementById('upDo').disabled = false;
  }
});

// ── 어드민 여부 확인 ───────────────────────────────────────
async function checkAdmin(){
  const { data:{ session } } = await sb.auth.getSession();
  isAdmin = !!session;
  document.body.classList.toggle('is-admin', isAdmin);
  document.getElementById('loginStatus').style.display = isAdmin ? '' : 'none';
}

// ── 초기화 ─────────────────────────────────────────────────
(async function(){
  await checkAdmin();
  await loadGallery();
})();
</script>
