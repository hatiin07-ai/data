<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SOOP 멀티뷰어 (2×2)</title>
<link rel="manifest" href="/viewer/manifest.json" />
<meta name="theme-color" content="#0c0c0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="멀티뷰어" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ color-scheme:dark; --bg:#0c0c0c; --panel:#161616; --line:#2a2a2a; --accent:#3fbf6a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; width:100%; height:100%; background:var(--bg); color:#eee;
    font-family:'맑은 고딕','Malgun Gothic',sans-serif; overflow:hidden; }
  body{ display:flex; flex-direction:column; }

  .toolbar{
    height:48px; flex:none; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px; padding:0 12px;
  }
  .toolbar .title{ font-weight:700; font-size:14px; color:#ddd; }
  .toolbar .title small{ color:#888; font-weight:400; margin-left:6px; }
  .toolbar button{
    height:32px; border:none; border-radius:7px; color:#fff; cursor:pointer;
    font-size:12.5px; font-family:inherit; padding:0 13px;
  }
  .btn-add{ background:#1e6446; }
  .btn-layout{ background:#3a3a3a; }
  .btn-layout.active{ background:#5a4a9a; }
  .spacer{ flex:1; }

  .main{ flex:1; display:flex; min-height:0; }

  .grid{
    flex:1; display:grid; gap:3px; padding:3px; min-width:0; min-height:0;
  }
  .grid.g-2x2{ grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
  .grid.g-1x4{ grid-template-columns:1fr; grid-template-rows:repeat(4,1fr); }
  .grid.g-4x1{ grid-template-columns:repeat(4,1fr); grid-template-rows:1fr; }
  .cell{
    background:#000; border:1px solid var(--line); border-radius:6px;
    display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; position:relative;
  }
  .cell-bar{
    height:28px; flex:none; background:#1c1c1c; display:flex; align-items:center; gap:4px; padding:0 5px;
    opacity:0; transition:opacity .15s; position:absolute; top:0; left:0; right:0; z-index:5;
  }
  .cell:hover .cell-bar{ opacity:1; }
  .cell.empty .cell-bar{ opacity:1; position:static; }
  .cell-num{ font-size:10px; font-weight:700; color:#50a0ff; min-width:18px; text-align:center; }
  .cell-name{ flex:1; min-width:0; font-size:11.5px; color:#ddd; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cell-btn{ height:20px; border:none; border-radius:4px; color:#fff; cursor:pointer; font-size:10.5px; padding:0 6px; flex:none; }
  .cb-clear{ background:#5a2020; }
  .cell-body{ flex:1; min-height:0; position:relative; background:#000; }
  .cell-body iframe{ width:100%; height:100%; border:0; display:block; }
  .cell-empty-msg{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#555; font-size:13px; gap:10px; text-align:center; padding:12px;
  }
  .empty-input-row{ display:flex; gap:5px; pointer-events:auto; }
  .empty-input{
    width:180px; height:30px; background:#222; border:1px solid #3a3a3a; border-radius:6px;
    color:#fff; font-size:12px; font-family:inherit; padding:0 10px;
  }
  .empty-input::placeholder{ color:#666; }
  .empty-go{ height:30px; border:none; border-radius:6px; background:#1e6446; color:#fff; cursor:pointer; font-size:12px; font-family:inherit; padding:0 12px; }

  .picker{ position:relative; }
  .picker-menu{
    position:absolute; top:36px; left:0; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:6px; display:none; grid-template-columns:repeat(2,1fr); gap:4px;
    z-index:30; min-width:280px; max-height:60vh; overflow:auto;
  }
  .picker-menu.open{ display:grid; }
  .picker-item{ display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:6px; cursor:pointer; font-size:12.5px; background:#222; }
  .picker-item:hover{ background:#333; }
  .picker-item.disabled{ opacity:.4; cursor:not-allowed; }
  .picker-item img{ width:24px; height:24px; border-radius:50%; flex:none; object-fit:cover; background:#444; }
  .picker-item .live{ width:6px; height:6px; border-radius:50%; background:#555; flex:none; }
  .picker-item .live.on{ background:var(--accent); box-shadow:0 0 5px var(--accent); }
  .picker-head{ grid-column:1/-1; font-size:11px; color:#888; padding:2px 4px; }

  /* 모바일 (~820px): 채팅 기능 잠금 + 세로 스택 배열 */
  /* 모바일 (~820px): 배열 전환 유지 + 세로 스크롤 (화면 밖 칸까지 스와이프로 볼 수 있게) */
  @media (max-width: 820px){
    body{ overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .toolbar{ position:sticky; top:0; z-index:40; height:auto; min-height:48px; padding:6px 10px; flex-wrap:wrap; gap:6px; }
    .toolbar .title small{ display:none; }
    .btn-add, .btn-layout{ font-size:12px; padding:0 10px; }
    .main{ display:block; min-height:0; }
    /* 그리드가 내용 높이만큼 늘어나게 (flex 고정 해제) → 넘치면 body가 스크롤 */
    .grid{ display:grid; height:auto; }
    /* 배열별 칸 높이 고정: 세로로 쌓이면 스크롤 */
    .grid.g-2x2{ grid-template-columns:1fr 1fr; grid-template-rows:none; grid-auto-rows:28vh; }
    .grid.g-1x4{ grid-template-columns:1fr; grid-template-rows:none; grid-auto-rows:32vh; }
    .grid.g-4x1{ grid-template-columns:1fr; grid-template-rows:none; grid-auto-rows:32vh; } /* 모바일에선 4×1도 세로로(가로 4칸은 너무 좁음) */
    .cell-bar{ opacity:1 !important; position:static !important; }
    .cell.empty .empty-input{ width:150px; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <span class="title">SOOP 멀티뷰어 <small id="layoutLabel">2×2</small></span>
    <div class="picker">
      <button class="btn-add" id="pickBtn">＋ 스트리머 추가</button>
      <div class="picker-menu" id="pickMenu"></div>
    </div>
    <span style="width:1px;height:20px;background:var(--line);margin:0 2px"></span>
    <button class="btn-layout" data-layout="2x2">2×2</button>
    <button class="btn-layout" data-layout="1x4">1×4</button>
    <button class="btn-layout" data-layout="4x1">4×1</button>
    <button class="btn-chat" id="pwaBtn" style="background:#2a5a3a;display:none">📲 앱 설치</button>
    <span class="spacer"></span>
    <span id="status" style="font-size:11.5px;color:#888"></span>
  </div>

  <div class="main">
    <div class="grid" id="grid"></div>
  </div>

<script>
const SUPABASE_URL = 'https://fwlkyyvrkunqqtyttilp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3bGt5eXZya3VucXF0eXR0aWxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2MTIyODcsImV4cCI6MjEwMDE4ODI4N30.bFTQVch4TYCxXAWvtTcWdLA4B4HeyAeepqLjZ2daJWI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MAX = 4;
let channels = new Array(MAX).fill(null);
let STREAMERS = [];
let layout = '2x2'; // 2x2 | 1x4 | 4x1

const gridEl = document.getElementById('grid');
const statusEl = document.getElementById('status');

function playerUrl(id){ return 'https://play.sooplive.com/' + id + '/direct?fromApi=1'; }

function applyLayout(){
  gridEl.className = 'grid g-' + layout;
  document.querySelectorAll('.btn-layout').forEach(function(b){
    b.classList.toggle('active', b.dataset.layout === layout);
  });
  const lbl = document.getElementById('layoutLabel');
  if(lbl) lbl.textContent = layout.replace('x', '×');
}

// 셀 4개는 최초 1회만 생성. 이후엔 renderSlot으로 해당 칸만 갱신
// → 칸 추가/제거해도 다른 칸의 iframe(재생 중인 방송)은 그대로 유지됨.
function buildGrid(){
  applyLayout();
  gridEl.innerHTML = '';
  for(let i = 0; i < MAX; i++){
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.id = 'cell-' + i;
    cell.innerHTML =
      '<div class="cell-bar">' +
        '<span class="cell-num">' + (i+1) + '</span>' +
        '<span class="cell-name" id="name-' + i + '"></span>' +
        '<button class="cell-btn cb-clear" data-clear="' + i + '" style="display:none">✕ 제거</button>' +
      '</div>' +
      '<div class="cell-body" id="body-' + i + '"></div>';
    gridEl.appendChild(cell);
    renderSlot(i);
  }
}

// 특정 칸만 갱신. 이미 같은 방송이 재생 중이면 iframe을 건드리지 않음.
function renderSlot(slot){
  const ch = channels[slot];
  const cell = document.getElementById('cell-' + slot);
  const body = document.getElementById('body-' + slot);
  const nameEl = document.getElementById('name-' + slot);
  const clearBtn = cell.querySelector('.cb-clear');
  if(!cell || !body) return;

  if(ch){
    cell.classList.remove('empty');
    nameEl.textContent = ch.name || ch.id;
    clearBtn.style.display = '';
    // 이미 같은 아이디의 iframe이 있으면 재로드하지 않음 (핵심)
    const existing = body.querySelector('iframe');
    if(!existing || existing.dataset.sid !== ch.id){
      mountPlayer(slot, ch.id);
    }
  } else {
    cell.classList.add('empty');
    nameEl.textContent = '비어 있음';
    clearBtn.style.display = 'none';
    body.innerHTML =
      '<div class="cell-empty-msg">' +
        '<div style="font-size:12px;color:#666;margin-bottom:2px">스트리머 아이디를 입력하거나<br>상단 [＋ 스트리머 추가]에서 선택</div>' +
        '<div class="empty-input-row">' +
          '<input class="empty-input" id="empty-inp-' + slot + '" placeholder="아이디 또는 방송 URL" />' +
          '<button class="empty-go" data-emptygo="' + slot + '">로드</button>' +
        '</div>' +
      '</div>';
  }
}

function mountPlayer(slot, id){
  const body = document.getElementById('body-'+slot);
  if(!body) return;
  body.innerHTML = '<iframe id="ifr-' + slot + '" data-sid="' + id + '" src="' + playerUrl(id) + '" ' +
    'frameborder="0" scrolling="no" allowfullscreen allow="autoplay; fullscreen; encrypted-media; local-network-access; loopback-network"></iframe>';
}

window.addEventListener('message', function(e){
  if(e.origin !== 'https://play.sooplive.com') return;
  const iframes = document.querySelectorAll('.cell-body iframe');
  const idx = Array.prototype.findIndex.call(iframes, function(f){ return e.source === f.contentWindow; });
  if(idx < 0) return;
  const data = e.data || {};
  if(data.cmd === 'PonReady'){
    e.source.postMessage({
      cmd: 'Pload', id: iframes[idx].dataset.sid,
      mutePlay: false, showChat: false, autoPlay: true,
      isAdShow: true, showQualityBox: true, fromApi: '1'
    }, 'https://play.sooplive.com');
  } else if(data.cmd === 'PupdateBroadInfo'){
    if(data.data && data.data.nick && channels[idx]){
      channels[idx].name = data.data.nick;
      const nameEl = document.getElementById('name-' + idx);
      if(nameEl) nameEl.textContent = data.data.nick;
    }
  }
});

function extractId(raw){
  raw = (raw || '').trim();
  if(!raw) return '';
  if(!/^https?:\/\//i.test(raw) && !raw.includes('/')) return raw; // 아이디만
  try{
    const u = new URL(raw.startsWith('http') ? raw : 'https://' + raw);
    const parts = u.pathname.split('/').filter(Boolean);
    return parts[0] || '';
  }catch(e){ return raw; }
}
function setSlot(slot, rawId, name){
  const id = extractId(rawId);
  if(!id) return;
  if(channels.some(function(c, i){ return c && c.id === id && i !== slot; })){ alert('이미 추가된 스트리머예요.'); return; }
  channels[slot] = { id: id, name: name || id };
  renderSlot(slot); saveState();
}
function addChannel(id, name){
  const slot = channels.findIndex(function(c){ return !c; });
  if(slot < 0){ alert('2×2는 최대 4개까지예요. 하나를 제거하고 추가해주세요.'); return; }
  if(channels.some(function(c){ return c && c.id === id; })){ alert('이미 추가된 스트리머예요.'); return; }
  channels[slot] = { id: id, name: name || id };
  renderSlot(slot); saveState();
}
function removeChannel(slot){ channels[slot] = null; renderSlot(slot); saveState(); }
gridEl.addEventListener('click', function(e){
  const cl = e.target.closest('[data-clear]');
  if(cl){ removeChannel(+cl.dataset.clear); return; }
  const go = e.target.closest('[data-emptygo]');
  if(go){
    const i = +go.dataset.emptygo;
    const inp = document.getElementById('empty-inp-' + i);
    if(inp) setSlot(i, inp.value);
  }
});
gridEl.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && e.target.classList.contains('empty-input')){
    const i = +e.target.id.replace('empty-inp-', '');
    setSlot(i, e.target.value);
  }
});

// 배열 전환: 그리드 클래스만 바꿔서 iframe 재로드 없이 레이아웃만 변경
document.querySelectorAll('.btn-layout').forEach(function(b){
  b.addEventListener('click', function(){
    layout = b.dataset.layout;
    applyLayout();
    saveState();
  });
});

const pickBtn = document.getElementById('pickBtn');
const pickMenu = document.getElementById('pickMenu');
pickBtn.addEventListener('click', function(e){ e.stopPropagation(); pickMenu.classList.toggle('open'); });
document.addEventListener('click', function(e){ if(!e.target.closest('.picker')) pickMenu.classList.remove('open'); });

function renderPicker(){
  const usable = STREAMERS.filter(function(s){ return s.soop_id; });
  pickMenu.innerHTML = '<div class="picker-head">추가할 스트리머 선택 (최대 4)</div>' +
    usable.map(function(s){
      const already = channels.some(function(c){ return c && c.id === s.soop_id; });
      return '<div class="picker-item' + (already ? ' disabled' : '') + '" data-sid="' + s.soop_id + '" data-name="' + (s.name||'').replace(/"/g,'') + '">' +
        '<span class="live" id="pk-live-' + s.soop_id + '"></span>' +
        '<img src="https://profile.img.sooplive.com/LOGO/' + s.soop_id.slice(0,2) + '/' + s.soop_id + '/' + s.soop_id + '.jpg" onerror="this.style.visibility=\'hidden\'" />' +
        '<span>' + s.name + (already ? ' ✓' : '') + '</span>' +
      '</div>';
    }).join('');
}
pickMenu.addEventListener('click', function(e){
  const item = e.target.closest('[data-sid]');
  if(!item || item.classList.contains('disabled')) return;
  addChannel(item.dataset.sid, item.dataset.name);
  renderPicker();
  if(channels.every(Boolean)) pickMenu.classList.remove('open');
});

// 온에어 상태를 병렬로 조회 → 드롭다운 점 갱신 + 온라인 목록 반환
async function fetchLiveStates(){
  const usable = STREAMERS.filter(function(s){ return s.soop_id; });
  const results = await Promise.all(usable.map(function(s){
    return fetch('/api/soop-status?id=' + encodeURIComponent(s.soop_id))
      .then(function(r){ return r.json(); })
      .then(function(d){ return { s: s, live: !!d.isLive }; })
      .catch(function(){ return { s: s, live: false }; });
  }));
  // 드롭다운 온에어 점 갱신
  results.forEach(function(r){
    const dot = document.getElementById('pk-live-' + r.s.soop_id);
    if(dot) dot.classList.toggle('on', r.live);
  });
  return results.filter(function(r){ return r.live; }).map(function(r){ return r.s; });
}

// 온라인 스트리머 자동 배치 (5명 이상이면 가나다순 앞 4명)
function autoPlaceLive(liveList){
  let list = liveList.slice();
  if(list.length >= 5){
    // 가나다순 정렬 후 앞 MAX명
    list = list.sort(function(a, b){ return (a.name || '').localeCompare(b.name || '', 'ko'); });
  }
  list = list.slice(0, MAX);
  channels = new Array(MAX).fill(null);
  list.forEach(function(s, i){ channels[i] = { id: s.soop_id, name: s.name || s.soop_id }; });
  for(let i = 0; i < MAX; i++) renderSlot(i);
  saveState();
}

function saveState(){ try{ localStorage.setItem('soop_mv2', JSON.stringify({ channels: channels, layout: layout })); }catch(e){} }
function loadState(){
  try{
    const st = JSON.parse(localStorage.getItem('soop_mv2') || '{}');
    if(Array.isArray(st.channels)){
      channels = st.channels.slice(0, MAX);
      while(channels.length < MAX) channels.push(null);
    }
    if(st.layout === '2x2' || st.layout === '1x4' || st.layout === '4x1') layout = st.layout;
  }catch(e){}
}

async function init(){
  loadState();
  buildGrid();
  const res = await sb.from('streamers').select('*').order('sort_order');
  STREAMERS = res.data || [];
  renderPicker();
  statusEl.textContent = '온에어 확인 중…';
  const liveList = await fetchLiveStates();
  // 저장된 채널이 하나도 없을 때(첫 진입/비어있음)만 온라인 자동 배치
  const hasSaved = channels.some(Boolean);
  if(!hasSaved && liveList.length){
    autoPlaceLive(liveList);
  }
  statusEl.textContent = '온에어 ' + liveList.length + '명 · 등록 ' + STREAMERS.filter(function(s){ return s.soop_id; }).length + '명';
}
init().catch(function(err){ statusEl.textContent = '로드 실패'; console.error(err); });

// ── PWA 설치 (뷰어) ────────────────────────────────────────
(function(){
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); });
  }
  const pwaBtn = document.getElementById('pwaBtn');
  let deferredPrompt = null;
  const ua = navigator.userAgent || '';
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isStandalone) return;

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferredPrompt = e; pwaBtn.style.display = '';
  });

  // iOS는 프롬프트가 없으니 버튼 항상 노출(안내용)
  if(isIOS) pwaBtn.style.display = '';

  pwaBtn.addEventListener('click', async function(){
    if(deferredPrompt){
      deferredPrompt.prompt();
      try{ await deferredPrompt.userChoice; }catch(e){}
      deferredPrompt = null; pwaBtn.style.display = 'none';
    } else if(isIOS){
      alert('아이폰은 Safari 하단 공유 버튼(⬆️) → "홈 화면에 추가"로 설치할 수 있어요.');
    } else {
      alert('브라우저 주소창의 설치 아이콘을 이용하거나, 잠시 후 다시 시도해주세요.');
    }
  });
  window.addEventListener('appinstalled', function(){ pwaBtn.style.display = 'none'; });
})();
</script>
</body>
</html>
